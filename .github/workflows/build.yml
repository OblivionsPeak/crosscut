name: Build and deploy

on:
  schedule:
    # Every 2 hours. GitHub runs scheduled jobs on a best-effort basis and
    # delays them under load, so treat this as "roughly every 2 hours".
    - cron: '17 */2 * * *'
  workflow_dispatch:        # lets you trigger a refresh by hand
  push:
    branches: [main]

permissions:
  contents: write      # needed to force-push the state branch
  pages: write
  id-token: write

# Never let two deploys race; a queued run supersedes a waiting one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # State lives on an orphan `state` branch. Restoring it by archive avoids
      # touching the working tree; the branch is rewritten wholesale each run so
      # its history stays exactly one commit deep.
      - name: Restore learned state
        run: |
          mkdir -p .state
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch --depth=1 origin state
            git archive FETCH_HEAD | tar -x -C .state
            echo "restored state ($(wc -c < .state/state.json) bytes)"
          else
            echo "no state branch yet - cold start"
          fi

      - name: Fetch feeds and cluster
        run: python build.py

      # Only after a successful build, so a failed run can never wipe what has
      # been learned so far.
      - name: Persist learned state
        run: |
          cd .state
          git init -q
          git checkout -q -b state
          git add -A
          git -c user.email=actions@github.com -c user.name="Crosscut bot" \
              commit -q -m "state after run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" state

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html style.css _site/
          cp -r js _site/
          cp -r data _site/
          cp feeds.json _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
