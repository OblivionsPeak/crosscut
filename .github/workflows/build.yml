name: Build and deploy

on:
  schedule:
    # Every 2 hours. GitHub runs scheduled jobs on a best-effort basis and
    # delays them under load, so treat this as "roughly every 2 hours".
    - cron: '17 */2 * * *'
  workflow_dispatch:        # lets you trigger a refresh by hand
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued run supersedes a waiting one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch feeds and cluster
        run: python build.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html style.css _site/
          cp -r js _site/
          cp -r data _site/
          cp feeds.json _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
